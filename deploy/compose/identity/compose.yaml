x-job: &job
  image: ${DEVFLOW_SETUP_IMAGE:?Set DEVFLOW_SETUP_IMAGE}
  restart: "no"
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 45s
  init: true
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  mem_limit: 512m
services:
  secret-stage:
    <<: *job
    command: [stage-secrets, identity]
    environment:
      DEVFLOW_EMAIL_ACTIVE_KEY_ID: ${DEVFLOW_EMAIL_ACTIVE_KEY_ID:-local-v1}
    volumes:
      - type: bind
        source: ${DEVFLOW_SECRETS_DIR:?Set DEVFLOW_SECRETS_DIR}
        target: /source
        read_only: true
        bind: {create_host_path: false}
      - database-secrets:/staged/database
      - migration-secrets:/staged/migration
      - api-secrets:/staged/api
      - worker-secrets:/staged/worker
      - redis-secrets:/staged/redis
  postgres:
    image: ${DEVFLOW_POSTGRES_IMAGE:?Set DEVFLOW_POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: identity_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, fsync=on, -c, full_page_writes=on, -c, synchronous_commit=on]
    volumes:
      - postgres-data:/var/lib/postgresql
      - database-secrets:/run/secrets:ro
    networks: [backend]
    depends_on: {secret-stage: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U identity_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *logging
    mem_limit: 768m
  db-bootstrap:
    <<: *job
    command: [db-bootstrap, identity]
    volumes:
      - type: bind
        source: ${DEVFLOW_SECRETS_DIR}
        target: /source
        read_only: true
        bind: {create_host_path: false}
    networks: [backend]
    depends_on: {postgres: {condition: service_healthy}}
  migration:
    image: ${DEVFLOW_IDENTITY_MIGRATION_IMAGE:?Set migration image}
    environment:
      DOTNET_ENVIRONMENT: ${DEVFLOW_ENVIRONMENT:-Production}
      ConnectionStrings__ApplicationDb: Host=postgres;Database=DevFlowIdentity;Username=identity_migrator;Include Error Detail=false
      Database__PasswordFile: /run/secrets/database-password
      Observability__Enabled: "false"
    volumes: ["migration-secrets:/run/secrets:ro"]
    networks: [backend]
    depends_on: {db-bootstrap: {condition: service_completed_successfully}}
    restart: "no"
    logging: *logging
    mem_limit: 512m
  db-grants:
    <<: *job
    command: [db-grants, identity]
    volumes:
      - type: bind
        source: ${DEVFLOW_SECRETS_DIR}
        target: /source
        read_only: true
        bind: {create_host_path: false}
    networks: [backend]
    depends_on: {migration: {condition: service_completed_successfully}}
  redis:
    image: ${DEVFLOW_REDIS_IMAGE:?Set DEVFLOW_REDIS_IMAGE}
    user: "999:999"
    entrypoint: [/bin/sh, -ec]
    command: ['exec redis-server --appendonly yes --appendfsync everysec --maxmemory 192mb --maxmemory-policy noeviction --requirepass "$$(cat /run/secrets/password)"']
    volumes: ["redis-data:/data", "redis-secrets:/run/secrets:ro"]
    networks: [backend]
    depends_on: {secret-stage: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/password)" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
  api:
    <<: *runtime
    image: ${DEVFLOW_IDENTITY_API_IMAGE:?Set DEVFLOW_IDENTITY_API_IMAGE}
    environment:
      ASPNETCORE_ENVIRONMENT: ${DEVFLOW_ENVIRONMENT:-Production}
      DOTNET_ENVIRONMENT: ${DEVFLOW_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__ApplicationDb: Host=postgres;Database=DevFlowIdentity;Username=identity_api;Include Error Detail=false
      Database__PasswordFile: /run/secrets/database-password
      Identity__VerificationEmail__KeyId: ${DEVFLOW_EMAIL_ACTIVE_KEY_ID:-local-v1}
      Identity__VerificationEmail__PublicKeyFile: /run/secrets/verification-public.pem
      Jwt__Issuer: ${DEVFLOW_JWT_ISSUER:-DevFlow.Identity}
      Jwt__Audience: ${DEVFLOW_JWT_AUDIENCE:-DevFlow}
      ForwardedHeaders__KnownProxies__0: ${DEVFLOW_GATEWAY_IP:?Set DEVFLOW_GATEWAY_IP}
      Cors__AllowedOrigins__0: ${DEVFLOW_FRONTEND_ORIGIN:?Set DEVFLOW_FRONTEND_ORIGIN}
      Cors__AllowedMethods__0: POST
      Cors__AllowedMethods__1: GET
      Cors__AllowedHeaders__0: Content-Type
      Cors__AllowedHeaders__1: Authorization
      Serilog__Using__0: Serilog.Sinks.Console
      Serilog__WriteTo__0__Name: Console
      Observability__Enabled: ${DEVFLOW_OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: DevFlow.Identity.API
    volumes: ["api-secrets:/run/secrets:ro"]
    networks:
      backend: {}
      messaging: {}
      http:
        aliases: [identity-api]
    depends_on:
      db-grants: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://localhost:8080/health/ready]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
  worker:
    <<: *runtime
    image: ${DEVFLOW_IDENTITY_WORKER_IMAGE:?Set DEVFLOW_IDENTITY_WORKER_IMAGE}
    environment:
      DOTNET_ENVIRONMENT: ${DEVFLOW_ENVIRONMENT:-Production}
      ConnectionStrings__ApplicationDb: Host=postgres;Database=DevFlowIdentity;Username=identity_worker;Include Error Detail=false
      Database__PasswordFile: /run/secrets/database-password
      Messaging__Host: ${DEVFLOW_MESSAGING_HOST:?Set DEVFLOW_MESSAGING_HOST}
      Messaging__Port: ${DEVFLOW_MESSAGING_PORT:-5671}
      Messaging__VirtualHost: ${DEVFLOW_MESSAGING_VIRTUAL_HOST:-devflow}
      Messaging__Username: identity
      Messaging__PasswordFile: /run/secrets/broker-password
      Messaging__Development: ${DEVFLOW_MESSAGING_DEVELOPMENT:-false}
      Messaging__UseTls: ${DEVFLOW_MESSAGING_USE_TLS:-true}
      Messaging__QuorumSize: ${DEVFLOW_MESSAGING_QUORUM_SIZE:-3}
      Observability__Enabled: ${DEVFLOW_OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: DevFlow.Identity.Worker
    volumes: ["worker-secrets:/run/secrets:ro"]
    networks: [backend, messaging]
    depends_on: {db-grants: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, /opt/devflow/worker-health.sh]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
networks:
  http:
    external: true
    name: ${DEVFLOW_STACK:?Set DEVFLOW_STACK}-http
  backend: {}
  messaging:
    external: true
    name: ${DEVFLOW_STACK:?Set DEVFLOW_STACK}-messaging
volumes:
  postgres-data: {}
  database-secrets: {}
  migration-secrets: {}
  api-secrets: {}
  worker-secrets: {}
  redis-secrets: {}
  redis-data: {}
